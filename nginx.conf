# ================================
# Kits Akshar College ERP — NGINX Configuration
# Reverse proxy + static file serving + security headers
# ================================

upstream erp_backend {
    server 127.0.0.1:8091;
    keepalive 64;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

server {
    listen 80;
    server_name erp.kitsakshar.edu.in;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.kitsakshar.edu.in;

    # ── SSL (Let's Encrypt / Certbot) ──
    ssl_certificate     /etc/letsencrypt/live/erp.kitsakshar.edu.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.kitsakshar.edu.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security Headers ──
    add_header X-Content-Type-Options   nosniff       always;
    add_header X-Frame-Options          SAMEORIGIN    always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Static Frontend (Vite build output) ──
    root /var/www/erp/client/dist;
    index index.html;

    # ── API Proxy ──
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;

        proxy_pass         http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Connection         "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;

        # Body size limit (file uploads)
        client_max_body_size 25M;
    }

    # ── Auth endpoint — stricter rate limit ──
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;

        proxy_pass         http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Connection         "";
    }

    # ── WebSocket (Socket.io) ──
    location /socket.io/ {
        proxy_pass         http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── Razorpay Webhook (no rate limit, external source) ──
    location = /api/v1/fees/webhook {
        proxy_pass         http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }

    # ── Health Check (no rate limit) ──
    location = /health {
        proxy_pass http://erp_backend;
    }

    # ── SPA Fallback ──
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── Block access to sensitive files ──
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    # ── Error pages ──
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
